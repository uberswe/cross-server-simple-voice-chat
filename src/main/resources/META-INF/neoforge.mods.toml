version = "1.0.0"
displayName = "Cross-Server Simple Voice Chat"
authors = "uberswe"
description = '''
Cross-server voice groups for Simple Voice Chat behind a Velocity proxy.
Group membership syncs over Redis; group audio relays directly between servers over UDP.
'''

